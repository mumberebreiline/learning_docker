version "3"
services:
  
  mongodb:
    
    image:mongo
    
    ports:
     - 27017:2701
    
    environment:
       MONGO_INITDB_ROOT_USERNAME=breiline
       MONGO_INITDB_ROOT_PASSWORD=1234




  mongo-express:

    image: mongo-express

    port:
     - 8081:8081
    environment:
      ME_CONFIG_MONGODB_SERVER=mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME=breiline
      ME_CONFIG_MONGODB_ADMINPASSWORD=1234